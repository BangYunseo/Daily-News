name: daily-news-brief

on:
  schedule:
    # cron은 UTC 기준. UTC 22:00 = KST 07:00.
    # (GitHub의 예약 실행은 부하에 따라 수 분~수십 분 지연될 수 있음)
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼 제공

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 아래 둘은 선택(Variables). 없으면 코드 기본값 사용.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # 도메인 인증을 마쳤다면 news@내도메인.com 형태로. 없으면 onboarding@resend.dev.
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: python main.py
